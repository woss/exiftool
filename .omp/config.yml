# omp project config
modelRoles:
  # architect/coder: opencode-zen (same glm-5.3-flash, zen provider) — proven agentic + cache-healthy
  default: opencode-zen/glm-5.3-flash
  # cheap tier: swarm fallback model, also drives tiny/smol background work (titles, memory LLM)
  smol: opencode-zen/gpt-6-luna
  # reviewer/test_engineer/explorer/sme/researcher/critic/docs/designer/curators: read-heavy review
  # work = cache-dominated; ember's $0/M cache reads make reviews ~free (quality unproven — A/B)
  slow: opencode-zen/muse-ember-1.0

# Swarm agent fallback_models -> retry fallback chains
retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    # coder/architect: real cross-family fallbacks (was self-referential glm->glm)
    default:
      - opencode-zen/gpt-6-luna
      - opencode-zen/muse-ember-1.0
    # ember (slow) falls back to proven glm-5.3-flash, then luna
    slow:
      - opencode-zen/glm-5.3-flash
      - opencode-zen/gpt-6-luna

# reasoningEffort: high everywhere in the swarm config
defaultThinkingLevel: high

# Mirror enabled_providers [opencode, lmstudio] for this repo's model picker.
# NOTE: replaces (not appends to) global enabledModels for sessions started here.
# enabledModels:
#   - zai/*
#   - opencode-zen/*
#   - lm-studio/*

# --- Memory (swarm sqlite memory -> mnemopi local SQLite backend) ---
memory:
  backend: mnemopi
mnemopi:
  # per-repo isolation, like storageDir .swarm/memory
  scoping: per-project-tagged
  recallLimit: 8 # memory.recall.defaultMaxItems: 8
  injectionTokenLimit: 1200 # memory.recall.defaultTokenBudget: 1200
  noEmbeddings: false # memory.embeddings.enabled: false
  polyphonicRecall: true # multi-signal RRF recall ~= retrieval.weights lexical/dense/metadata
  proactiveLinking: true # memory.link.enabled: true
  autoRecall: true
  autoRetain: true # writes.mode "propose" has no direct equivalent; exit path retains anyway

# --- Knowledge capture ---
autolearn:
  enabled: true # learn tool + managed skill playbooks under ~/.omp/agent/managed-skills

# swarm redaction.rejectDurableSecrets: true
secrets:
  enabled: true
# --- GitButler workspace: features are virtual branches in the base checkout ---
# Subagents share the GitButler workspace and commit to lanes via
# `but commit -b <branch> -m "…" <ids>` (IDs from `but diff`); git write commands
# are forbidden in workspace mode (see .omp/rules/worktrees.md).
# Session escape hatch: run omp with `--config worktree-overlay.yml` to re-enable
# per-task worktrees when a session genuinely needs them.
task:
  isolation:
    enabled: false
