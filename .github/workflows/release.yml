name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # ---------- quality gates ----------
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - uses: oven-sh/setup-bun@v2
      - name: Install reference exiftool 13.55 (parity)
        run: |
          curl -fsSL -o /tmp/exiftool.tar.gz https://github.com/exiftool/exiftool/archive/refs/tags/13.55.tar.gz
          tar -xzf /tmp/exiftool.tar.gz -C /opt
          echo "/opt/exiftool-13.55" >> "$GITHUB_PATH"
          export PATH="/opt/exiftool-13.55:$PATH"
          exiftool -ver
      - run: pnpm install --frozen-lockfile
      - name: Version sync (tag vs package.json / jsr.json)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for f in package.json jsr.json; do
            CFG=$(node -p "require('./$f').version")
            if [ "$TAG" != "$CFG" ]; then
              echo "tag v$TAG does not match $f version $CFG"; exit 1
            fi
          done
      - name: Typecheck
        run: pnpm check
      - name: Full test suite
        run: pnpm test
      - name: Coverage audit (100% line/function)
        run: pnpm coverage-audit

  # ---------- publishing ----------
  publish-npm:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish core package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-jsr:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish to JSR
        run: npx jsr@latest publish

  github-release:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package dist tarball
        run: tar czf "exiftool-ts-${GITHUB_REF_NAME}.tar.gz" dist package.json README.md
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: exiftool-ts-*.tar.gz
