name: Docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Root deps: typedoc + typedoc.html.json generation
      - name: Install root deps
        run: pnpm install --frozen-lockfile

      # Docs deps: docusaurus build
      - name: Install docs deps
        working-directory: docs
        run: pnpm install --frozen-lockfile

      # Regenerate TypeDoc HTML and stage it under static/ so Docusaurus serves it
      - name: Generate TypeDoc HTML
        run: npx typedoc --options typedoc.html.json
      - name: Stage TypeDoc into static
        run: rm -rf docs/static/typedoc && cp -r docs/typedoc-html docs/static/typedoc

      - name: Build Docusaurus site
        working-directory: docs
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
