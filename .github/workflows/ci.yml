name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install reference exiftool 13.55 (parity)
        run: |
          curl -fsSL -o /tmp/exiftool.tar.gz https://github.com/exiftool/exiftool/archive/refs/tags/13.55.tar.gz
          tar -xzf /tmp/exiftool.tar.gz -C /opt
          echo "/opt/exiftool-13.55" >> "$GITHUB_PATH"
          export PATH="/opt/exiftool-13.55:$PATH"
          exiftool -ver
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Coverage audit (100% line/function)
        run: pnpm coverage-audit
