name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          submodules: recursive
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Reference exiftool (pinned submodule)
        run: |
          echo "$GITHUB_WORKSPACE/vendor/exiftool" >> "$GITHUB_PATH"
          exiftool -ver
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Coverage audit (100% line/function)
        run: pnpm coverage-audit
